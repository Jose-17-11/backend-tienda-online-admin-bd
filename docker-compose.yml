version: '3.8'

services:
  backend:
    build: .
    container_name: tienda_online_backend
    ports:
      - "4000:3000"  # Mapeo: HOST:CONTAINER
    environment:
      - NODE_ENV=development
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - tienda_network

  db:
    image: mysql:8.0
    container_name: tienda_online_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tienda_online
      MYSQL_USER: tienda_user
      MYSQL_PASSWORD: tienda_pass
    ports:
      - "3307:3306"  # Puerto alternativo para MySQL
    volumes:
      - tienda_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tienda_network
    restart: unless-stopped

volumes:
  tienda_mysql_data:

networks:
  tienda_network:
    driver: bridge